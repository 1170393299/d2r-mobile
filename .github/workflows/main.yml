name: Build d2r-mobile IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          echo "start build"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: D2R-Mobile.ipa
          path: *.ipa
